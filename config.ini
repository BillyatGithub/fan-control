[system_info]
system_os = Proxmox
ipmi_type = SM_X10
single_zone = True
temp_focus = Both
disks = ['sda', 'sdb', 'sdc', 'sdd']

[fan_curve]
cpu = [[0, 0], [35, 1], [45, 2], [55, 2], [65, 3], [75, 6], [80, 35], [85, 40], [90, 80], [95, 90], [100, 100]]
hdd = [[0, 0], [25, 5], [35, 10], [40, 15], [45, 20], [50, 30], [60, 60], [70, 70], [80, 80], [90, 100], [100, 100]]

[hdd_panic]
max_temp = 50
panic_addition = 5

[detect_timers]
cpu_timer = 1
hdd_timer = 30

[log_config]
file_name = /root/fan-control/fan-control.log
format = %%(asctime)s %%(levelname)s: %%(message)s
date_format = %%Y/%%m/%%d %%I:%%M:%%S %%p
frequency = On_Change
